<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioVision AI | Clinical Decision Support</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 py-4 px-8 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">❤️</span>
                <h1 class="text-2xl font-black text-rose-600 tracking-tight">CardioVision <span class="text-slate-700 font-light text-lg">AI Suite</span></h1>
            </div>
            <span class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-3 py-1 rounded-full">FastAPI Connected 🚀</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Input Form Card -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-xl font-bold mb-4 text-slate-700 border-b pb-2">📋 Patient Clinical Vitals</h2>
            
            <form id="prediction-form" class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Age (Years)</label>
                    <input type="number" id="Age" value="53" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-rose-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Weight (kg)</label>
                    <input type="number" id="Weight" value="72" step="0.1" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-rose-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Height/Length (cm)</label>
                    <input type="number" id="Length" value="168" step="0.1" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-rose-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">BMI</label>
                    <input type="number" id="BMI" value="25.5" step="0.1" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-rose-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Sex</label>
                    <select id="Sex" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-rose-500 outline-none">
                        <option value="Male" selected>Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Chest Pain Type (1-4)</label>
                    <input type="number" id="Chest_pain_type" value="2" min="1" max="4" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-rose-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Blood Pressure (BP)</label>
                    <input type="number" id="BP" value="130" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-rose-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Cholesterol (mg/dL)</label>
                    <input type="number" id="Cholesterol" value="240" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-rose-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Fasting Blood Sugar (FBS)</label>
                    <input type="number" id="FBS" value="105" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-rose-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Heart Rate (bpm)</label>
                    <input type="number" id="Heart_rate" value="75" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-rose-500 outline-none">
                </div>

                <div class="col-span-2 mt-4">
                    <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200">
                        🚀 Run AI Risk Assessment
                    </button>
                </div>
            </form>
        </div>

        <!-- Results & Explainability Panel -->
        <div class="space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-bold mb-4 text-slate-700 border-b pb-2">📊 Assessment Dashboard</h2>
                
                <div id="placeholder-state" class="text-center py-12 text-slate-400">
                    <p class="text-4xl mb-2">👈</p>
                    <p>Enter patient vitals and run assessment to view results.</p>
                </div>

                <div id="results-state" class="hidden space-y-4">
                    <div id="risk-banner" class="p-4 rounded-xl font-bold text-center text-lg"></div>
                    <div>
                        <p class="text-xs uppercase text-slate-400 font-bold">Estimated CAD Probability</p>
                        <p id="prob-score" class="text-3xl font-black text-slate-800"></p>
                    </div>

                    <div class="border-t pt-4">
                        <h3 class="font-bold text-slate-700 mb-2">🧠 AI Clinical Reasoning (SHAP Factors)</h3>
                        <ul id="shap-factors" class="space-y-2 text-sm"></ul>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- JavaScript Logic to Connect to FastAPI -->
    <script>
        document.getElementById('prediction-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const payload = {
                features: {
                    "Age": parseFloat(document.getElementById('Age').value),
                    "Weight": parseFloat(document.getElementById('Weight').value),
                    "Length": parseFloat(document.getElementById('Length').value),
                    "BMI": parseFloat(document.getElementById('BMI').value),
                    "Sex": document.getElementById('Sex').value,
                    "Chest pain type": parseInt(document.getElementById('Chest_pain_type').value),
                    "BP": parseFloat(document.getElementById('BP').value),
                    "Cholesterol": parseFloat(document.getElementById('Cholesterol').value),
                    "FBS": parseFloat(document.getElementById('FBS').value),
                    "Heart rate": parseFloat(document.getElementById('Heart_rate').value)
                }
            };

            try {
                const response = await fetch('http://127.0.0.1:8000/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const result = await response.json();
                    
                    document.getElementById('placeholder-state').classList.add('hidden');
                    document.getElementById('results-state').classList.remove('hidden');

                    const riskBanner = document.getElementById('risk-banner');
                    if (result.risk_level === "High Risk") {
                        riskBanner.className = "p-4 rounded-xl font-bold text-center text-lg bg-red-100 text-red-700";
                        riskBanner.innerText = `🚨 ${result.risk_level} Detected`;
                    } else {
                        riskBanner.className = "p-4 rounded-xl font-bold text-center text-lg bg-emerald-100 text-emerald-700";
                        riskBanner.innerText = `✅ ${result.risk_level} Detected`;
                    }

                    document.getElementById('prob-score').innerText = `${result.cad_probability}%`;

                    const factorsList = document.getElementById('shap-factors');
                    factorsList.innerHTML = '';
                    result.key_factors.forEach((factor, index) => {
                        const icon = factor.impact_direction === 'increased' ? '📈' : '📉';
                        const li = document.createElement('li');
                        li.className = "bg-slate-50 p-2 rounded border border-slate-100 flex justify-between items-center";
                        li.innerHTML = `<span><strong>${index + 1}. ${factor.feature}</strong> (Val: ${factor.value})</span><span>${icon} ${factor.impact_direction}</span>`;
                        factorsList.appendChild(li);
                    });

                } else {
                    alert('Error from API backend');
                }
            } catch (err) {
                alert('Could not connect to FastAPI backend. Make sure Uvicorn is running!');
            }
        });
    </script>
</body>
</html>
